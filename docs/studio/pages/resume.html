<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Management | Amit Studio</title>
  <link rel="stylesheet" href="../../shared/css/design-system.css" />
  <link rel="stylesheet" href="../../shared/css/components.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-logo">Amit Studio</div>
    <button class="menu-toggle-btn" id="menu-toggle-btn">⋮</button>
  </nav>

  <div class="studio-container">
    <aside class="studio-sidebar" id="studio-sidebar">
      <div class="studio-logo">Amit.</div>
      <nav class="studio-nav">
        <a href="profile.html" class="nav-link">👤 Profile</a>
        <a href="projects.html" class="nav-link">💼 Projects</a>
        <a href="skills.html" class="nav-link">🧠 Skills</a>
        <a href="certificates.html" class="nav-link">🎓 Certificates</a>
        <a href="resume.html" class="nav-link active">📄 Resume</a>
        <a href="gallery.html" class="nav-link">🖼️ Gallery</a>
        <a href="videos.html" class="nav-link">🎬 Videos</a>
        <a href="blog.html" class="nav-link">📝 Blog</a>
        <a href="analytics.html" class="nav-link">📊 Analytics</a>
        <a href="settings.html" class="nav-link">⚙️ Settings</a>
        <button id="logout-btn" class="btn btn-outline" style="width:100%; margin-top: var(--space-lg);">🚪 Logout</button>
      </nav>
    </aside>

    <main class="studio-main">
      <h1>📄 Resume Management</h1>
      
      <div class="card" style="margin-bottom: var(--space-lg);">
        <h3 class="card-title">Upload New Resume</h3>
        <div class="form-grid" style="grid-template-columns: 1fr;">
          <label class="form-field">
            <span>Resume Title</span>
            <input type="text" id="resume-title" placeholder="e.g., Senior Developer 2025" required />
          </label>
          <label class="form-field">
            <span>Description</span>
            <textarea id="resume-description" placeholder="Brief description" rows="2"></textarea>
          </label>
          <label class="form-field">
            <span>Upload File (PDF/Image/Text)</span>
            <input type="file" id="resume-file" accept=".pdf,.jpg,.jpeg,.png,.txt,.doc,.docx" required />
          </label>
        </div>
        <p id="resume-upload-status" class="text-muted" style="min-height:1.2em; margin-bottom: var(--space-sm);"></p>
        <button id="resume-upload-btn" class="btn btn-primary" style="width:100%;">⬆️ Upload Resume</button>
      </div>

      <div class="card">
        <h3 class="card-title">Your Resumes</h3>
        <div id="resume-list-container"><p class="text-muted">Loading...</p></div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/resume.js"></script>
</body>
</html>
