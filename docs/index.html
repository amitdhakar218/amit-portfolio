  <script>
    // Load Projects
    async function loadProjectsHome() {
      if (typeof firebase !== "undefined" && firebase.database) {
        firebase.database().ref("projects").once("value", snapshot => {
          const projects = snapshot.val();
          if (!projects) return;
          const html = Object.entries(projects).slice(0, 3).map(([id, proj]) => `
            <div class="card">
              <h3 class="card-title">${proj.name || 'Project'}</h3>
              <p class="card-body">${proj.description || ''}</p>
            </div>
          `).join("");
          const el = document.getElementById("projects-grid");
          if (el) el.innerHTML = html;
        });
      }
    }

    // Load Skills
    async function loadSkillsHome() {
      if (typeof firebase !== "undefined" && firebase.database) {
        firebase.database().ref("skills").once("value", snapshot => {
          const skills = snapshot.val();
          if (!skills) return;
          const html = Object.values(skills).slice(0, 5).map(skill => `<span class="btn btn-outline">${skill}</span>`).join("");
          const el = document.getElementById("skills-list");
          if (el) el.innerHTML = html;
        });
      }
    }

    // Load About
    async function loadAboutHome() {
      if (typeof firebase !== "undefined" && firebase.database) {
        firebase.database().ref("profile/about").once("value", snapshot => {
          const about = snapshot.val();
          if (!about) return;
          const introEl = document.getElementById("about-intro");
          if (introEl) introEl.textContent = about.introduction || '';
          const eduEl = document.getElementById("about-education");
          if (eduEl) eduEl.textContent = about.education || '—';
          const expEl = document.getElementById("about-experience");
          if (expEl) expEl.textContent = about.experience || '—';
          const goalEl = document.getElementById("about-goals");
          if (goalEl) goalEl.textContent = about.goals || '—';
        });
      }
    }

    // Call on load
    document.addEventListener("DOMContentLoaded", () => {
      loadProjectsHome();
      loadSkillsHome();
      loadAboutHome();
    });
  </script>
